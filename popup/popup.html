<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Block Web Element</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1>Block Web Element</h1>
      </header>

      <!-- 一级菜单：网址列表 -->
      <div id="list-view" class="list-view">
        <div id="rule-list" class="rule-list"></div>

        <button id="add-rule-btn" class="btn btn-primary" data-i18n="addRule">+ 添加规则</button>

        <div class="toolbar">
          <button id="export-btn" class="btn" data-i18n="exportConfig">导出配置</button>
          <button id="import-btn" class="btn" data-i18n="importConfig">导入配置</button>
        </div>
        <input type="file" id="import-file" accept=".json,application/json" hidden />
        <p id="io-msg" class="io-msg save-msg"></p>
      </div>

      <!-- 二级菜单：新增规则 / 编辑已有网址 -->
      <div id="editor" class="editor hidden">
        <div class="editor-card">
          <p id="editor-title" class="editor-title" data-i18n="editorTitleNew">新增规则</p>

          <div class="field" id="url-field">
            <label for="rule-url" data-i18n="labelUrl">网址规则</label>
            <input
              type="text"
              id="rule-url"
              data-i18n-placeholder="placeholderUrl"
              placeholder="例如: *.example.com 或 example.com/*"
            />
            <p class="hint" data-i18n="hintUrl">支持通配符 *，不写通配符则按“包含匹配”</p>
          </div>

          <div class="field">
            <label for="rule-selectors" data-i18n="labelElement">屏蔽元素</label>
            <input
              type="text"
              id="rule-selectors"
              data-i18n-placeholder="placeholderElement"
              placeholder="例如: .ad-banner、#popup、div[data-ad] > a"
            />
            <p class="hint" data-i18n="hintElement">
              class / id 必须带 .（class）或 #（id）前缀；也支持完整 CSS 选择器；每次只能填一个元素
            </p>
          </div>

          <div class="actions">
            <button id="save-btn" class="btn btn-primary" data-i18n="save">保存</button>
            <button id="cancel-btn" class="btn" data-i18n="back">返回</button>
            <span id="save-msg" class="save-msg"></span>
          </div>
        </div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
